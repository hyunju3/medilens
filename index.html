<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>메디렌즈 · 의학용어 분석기</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#15211f; --ink2:#4b5a57; --ink3:#7d8b88; --line:#e2e8e6;
  --brand:#0f766e; --brand2:#115e59; --brandbg:#e6f4f1;
  --p:#2563eb; --pbg:#e8efff; --r:#15803d; --rbg:#e7f6ec; --s:#c2410c; --sbg:#fff0e6; --v:#6b7280; --vbg:#f1f2f4;
  --tb:#0f766e; --tbbg:#e6f4f1; --sup:#6d28d9; --supbg:#f1ebff; --warn:#b45309; --warnbg:#fff7e0;
  --radius:16px; --shadow:0 1px 2px rgba(16,40,36,.06),0 4px 16px rgba(16,40,36,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1514; --card:#162120; --ink:#e7efed; --ink2:#b4c2bf; --ink3:#83938f; --line:#26332f;
    --brand:#2dd4bf; --brand2:#5eead4; --brandbg:#123330;
    --p:#93b4ff; --pbg:#1c2740; --r:#6ee7a0; --rbg:#15301f; --s:#fdba74; --sbg:#3a2414; --v:#a1a8b3; --vbg:#232a31;
    --tb:#5eead4; --tbbg:#123330; --sup:#c4b5fd; --supbg:#271f3d; --warn:#fcd34d; --warnbg:#3a2f12;
    --shadow:0 1px 2px rgba(0,0,0,.3);}
  .sb .go,.logo,.order .n,.seg button.on{color:#062b27}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 10px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 2px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.3px}
.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.brand .sp{flex:1}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;display:grid;place-items:center}
.iconbtn:active{background:var(--line)}
.searchbox{position:relative}
.sb{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:0 6px 0 12px}
.sb:focus-within{border-color:var(--brand)}
.sb input::-webkit-search-cancel-button,.sb input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sb input{flex:1;border:0;outline:0;background:transparent;font-size:17px;padding:13px 4px;color:var(--ink);min-width:0}
.sb .go{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:15px}
.sb .clr{border:0;background:transparent;color:var(--ink3);font-size:18px;padding:6px 8px;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.sugg.on{display:block}
.sugg button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:11px 14px;gap:10px;align-items:baseline;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button.sel,.sugg button:hover{background:var(--brandbg)}
.sugg .se{font-weight:650}
.sugg .sk{color:var(--ink2);font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .sh{font-size:11px;color:var(--ink3);white-space:nowrap}
.nav{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink2)}
.crumb{font-size:13px;color:var(--ink3)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin:12px 0;border:1px solid var(--line)}
.card h2{margin:0;font-size:26px;letter-spacing:-.4px;word-break:break-word}
.card h3{font-size:13px;color:var(--ink3);margin:18px 0 8px;font-weight:700;letter-spacing:.2px}
.card h3:first-child{margin-top:0}
.thead{display:block}
.thead .t{min-width:0}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.card h2.long{font-size:22px}
.card h2.xlong{font-size:19px}
.abtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 12px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.abtn small{font-size:12px;color:var(--ink2)}
.abtn:active{transform:scale(.96)}
.abtn.on{background:var(--warnbg);border-color:var(--warn)}
.pr{font-size:17px;color:var(--ink2);margin-top:6px}
.pr b{color:var(--ink);font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--vbg);color:var(--ink2);font-weight:600;border:0;cursor:pointer}
.tag.tb{background:var(--tbbg);color:var(--tb)}
.tag.sup{background:var(--supbg);color:var(--sup)}
.means{list-style:none;margin:0;padding:0}
.means li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.means li:last-child{border-bottom:0}
.src{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;white-space:nowrap;margin-top:3px}
.src.tb{background:var(--tbbg);color:var(--tb)}
.src.sup{background:var(--supbg);color:var(--sup)}
.src.auto{background:var(--warnbg);color:var(--warn)}
.ko{font-size:19px;font-weight:650;line-height:1.4}
.ko small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.abrow{display:flex;flex-wrap:wrap;gap:6px}
.ab{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;background:var(--vbg);border-radius:8px;padding:4px 9px;font-size:15px}
.ab small{font-family:inherit;font-weight:500;color:var(--ink3);font-size:11px;margin-left:4px}
.word{margin:6px 0 12px}
.word .wl{font-size:13px;color:var(--ink3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.chip{border:0;border-radius:12px;padding:7px 10px 6px;text-align:center;cursor:pointer;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.chip .cs{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:800}
.chip .ck{font-size:12px;font-weight:600;max-width:120px}
.chip .ct{font-size:10px;opacity:.75}
.chip.P{background:var(--pbg);color:var(--p)}
.chip.R{background:var(--rbg);color:var(--r)}
.chip.S{background:var(--sbg);color:var(--s)}
.chip.V{background:var(--vbg);color:var(--v);cursor:default;min-width:30px}
.chip.W{background:var(--vbg);color:var(--ink2)}
.plus{align-self:center;color:var(--ink3);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.order{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;margin-top:8px}
.order b{font-weight:700}
.order .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;margin-right:3px;vertical-align:1px}
.parts{list-style:none;margin:0;padding:0}
.parts li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:baseline;cursor:pointer}
.parts li:last-child{border-bottom:0}
.parts .pf{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;min-width:92px}
.parts .pt{font-size:11px;color:var(--ink3);white-space:nowrap}
.desc{font-size:15px;line-height:1.65;margin:0 0 8px}
.desc .src{margin-right:6px}
.note{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:10px}
.note b{color:var(--warn)}
.info{background:var(--brandbg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:10px}
.rel{margin-bottom:10px}
.rel .rh{font-size:13px;margin-bottom:6px}
.rel .rh b{font-family:ui-monospace,Menlo,Consolas,monospace}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;text-align:left}
.pill small{color:var(--ink3);margin-left:4px}
.pill:active{background:var(--brandbg)}
.more{border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 2px;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.row{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:12px 4px;gap:10px;align-items:center;cursor:pointer}
.row:active{background:var(--brandbg)}
.row .re{font-weight:650;font-size:16px;word-break:break-word}
.row .rk{color:var(--ink2);font-size:14px;margin-top:2px}
.row .rb{margin-left:auto;flex-shrink:0}
.row .rm{flex:1;min-width:0}
.hint{color:var(--ink3);font-size:13px;line-height:1.6}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ex button{border:1px dashed var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.tile b{display:block;font-size:15px}
.tile span{font-size:12px;color:var(--ink3)}
.tile:active{background:var(--brandbg)}
.did{background:var(--warnbg);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin:12px 0}
.did h3{margin:0 0 8px;color:var(--warn);font-size:15px}
.did .pills .pill{border-color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--ink3);padding:30px 0}
.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
footer{color:var(--ink3);font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">M</div>
      <div><h1>메디렌즈</h1><small>의학용어 발음 · 구조 분석 사전</small></div>
      <div class="sp"></div>
      <button class="iconbtn" id="btnHome" aria-label="처음 화면">🏠</button>
      <button class="iconbtn" id="btnFav" aria-label="즐겨찾기">⭐</button>
    </div>
    <div class="searchbox">
      <form class="sb" id="form" autocomplete="off">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="의학용어, 한글 뜻, 약어, 결합형" aria-label="검색어" autocapitalize="off" spellcheck="false">
        <button type="button" class="clr" id="clr" aria-label="지우기" hidden>✕</button>
        <button type="submit" class="go">분석</button>
      </form>
      <div class="sugg" id="sugg" role="listbox"></div>
    </div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<script>/* 의학용어 형태 분석기 — 브라우저와 Node 양쪽에서 같은 코드 사용 */
(function (root) {
  "use strict";

  const GENERIC_SUFFIX = new Set(["a", "um", "us", "is", "ion", "ation", "ity", "y", "ia", "ism", "sis", "es", "s", "ae", "i"]);
  const ADJ_SUFFIX = new Set(["ac", "al", "ar", "ary", "eal", "ic", "ical", "ous", "tic", "ory", "ile", "ine", "ior", "otic", "emic", "ive", "ent", "ant", "atic", "ative"]);

  function build(MORPH) {
    // MORPH: [{id,t:'P'|'R'|'S',f:'cardi/o',ko,en,st:[stems]}]
    const P = [], R = [], S = [];
    for (const m of MORPH) {
      for (const s of m.st) {
        const e = { s, m };
        if (m.t === "P") P.push(e); else if (m.t === "R") R.push(e); else S.push(e);
      }
    }
    const byLen = (a, b) => b.s.length - a.s.length;
    P.sort(byLen); R.sort(byLen); S.sort(byLen);
    // 첫 글자 색인
    const idx = (arr) => { const o = {}; for (const e of arr) { (o[e.s[0]] = o[e.s[0]] || []).push(e); } return o; };
    return { P: idx(P), R: idx(R), S: idx(S) };
  }

  // 한 단어를 접두사/어근/결합모음/접미사로 나눈다
  function segment(word, IDX) {
    const w = word.toLowerCase();
    const n = w.length;
    if (n < 2) return null;
    // state: pos, stage(0 시작,1 접두사 뒤,2 어근 뒤,3 접미사 뒤), suffixCount
    const memo = new Map();
    // mc: 의미 있는 조각 수(0,1,2 이상) — 끝까지 갔을 때 2개 이상이어야 분석으로 인정
    function go(i, stage, sc, mc) {
      const key = i + "|" + stage + "|" + sc + "|" + mc;
      if (memo.has(key)) return memo.get(key);
      let best = null;
      if (i === n) {
        if (stage >= 2 && mc >= 2) best = { c: 0, p: [] };
        memo.set(key, best);
        return best;
      }
      const ch = w[i];
      const tryAdd = (piece, cost, j, st, sc2) => {
        const r = go(j, st, sc2, piece.t === "V" ? mc : Math.min(2, mc + 1));
        if (r) {
          const c = r.c + cost;
          if (!best || c < best.c - 1e-9) best = { c, p: [piece].concat(r.p) };
        }
      };
      if (stage <= 1 || (stage === 2 && i > 0 && (w[i - 1] === "o" || w[i - 1] === "i"))) {
        for (const e of (IDX.P[ch] || [])) {
          if (w.startsWith(e.s, i)) tryAdd({ s: e.s, t: "P", m: e.m }, stage === 2 ? 1.3 : 1.0, i + e.s.length, 1, 0);
        }
      }
      if (stage <= 2) {
        for (const e of (IDX.R[ch] || [])) {
          if (w.startsWith(e.s, i)) {
            const L = e.s.length;
            const cost = 1.0 + (L <= 2 ? 0.8 : L === 3 ? 0.25 : 0);
            tryAdd({ s: e.s, t: "R", m: e.m }, cost, i + L, 2, 0);
          }
        }
      }
      if (stage === 2 && (ch === "o" || ch === "i") && i + 1 < n) {
        tryAdd({ s: ch, t: "V" }, 0.15, i + 1, 2, 0);
      }
      if (stage >= 1 && sc < 2) {
        // 접미사는 어근 뒤, 또는 접두사 바로 뒤(a/pnea 같은 경우)
        for (const e of (IDX.S[ch] || [])) {
          if (w.startsWith(e.s, i)) {
            const gen = GENERIC_SUFFIX.has(e.s) || ADJ_SUFFIX.has(e.s);
            let cost = gen ? (e.s === "a" ? 1.35 : (e.s === "y" ? 1.3 : (e.s === "um" || e.s === "us" || e.s === "is" ? 1.25 : 1.15))) : (e.s === "or" ? 1.2 : 1.0);
            if (stage === 1 && gen) continue; // 접두사+일반어미만으로는 단어가 아님
            tryAdd({ s: e.s, t: "S", m: e.m }, cost + (sc ? 0.3 : 0), i + e.s.length, 3, sc + 1);
          }
        }
      }
      memo.set(key, best);
      return best;
    }
    const r = go(0, 0, 0, 0);
    if (!r) return null;
    // 의미 있는 조각이 하나뿐(예: 단어 전체가 어근 하나)이면 분석으로 보지 않음
    const meaningful = r.p.filter((x) => x.t !== "V");
    if (meaningful.length < 2) return null;
    return r.p;
  }

  // 단어 하나 분석: 수동 분석 > 일반 단어 > 형태소 분해 > 복수형 처리
  function analyzeWord(word, D) {
    const lw = word.toLowerCase();
    if (D.OVR[lw]) return { w: word, how: "ovr", parts: D.OVR[lw] };
    if (D.WORDS[lw] && !D.PREFER_SEG[lw]) return { w: word, how: "word", gloss: D.WORDS[lw] };
    const seg = segment(lw, D.IDX);
    if (seg) return { w: word, how: "seg", parts: seg.map(toPart) };
    // 복수형/변화형
    for (const [end, rep] of [["ies", "y"], ["ae", "a"], ["s", ""], ["es", ""], ["i", "us"]]) {
      if (lw.endsWith(end) && lw.length > end.length + 3) {
        const base = lw.slice(0, -end.length) + rep;
        if (D.WORDS[base]) return { w: word, how: "word", gloss: D.WORDS[base], plural: true };
        const s2 = segment(base, D.IDX);
        if (s2) return { w: word, how: "seg", parts: s2.map(toPart), plural: true };
      }
    }
    if (D.WORDS[lw]) return { w: word, how: "word", gloss: D.WORDS[lw] };
    return { w: word, how: "none" };
  }
  function toPart(x) {
    if (x.t === "V") return { s: x.s, t: "V", ko: "결합모음", f: "" };
    return { s: x.s, t: x.t, ko: x.m.ko, f: x.m.f, id: x.m.id };
  }

  function words(term) {
    return String(term).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\(.*?\)/g, " ").split(/[\s,\/]+|-(?=[a-z])/i).map((x) => x.replace(/[^A-Za-z]/g, "")).filter((x) => x.length > 0);
  }

  function analyzeTerm(term, D) {
    const main = term.split(",")[0];
    return words(main).map((w) => analyzeWord(w, D));
  }

  // ---------- 검색과 맞춤법 추천 ----------
  function norm(s) { return String(s).toLowerCase().replace(/[‐-―]/g, "-").replace(/\s+/g, " ").trim(); }
  function loose(s) {
    // 철자 실수를 흡수하는 느슨한 형태
    return norm(s).replace(/[^a-z]/g, "").replace(/ph/g, "f").replace(/rrh/g, "r").replace(/ae/g, "e").replace(/oe/g, "e")
      .replace(/y/g, "i").replace(/k/g, "c").replace(/(.)\1+/g, "$1");
  }
  function dl(a, b, max) {
    // Damerau-Levenshtein(인접 전치 포함), max 넘으면 일찍 끝냄
    const n = a.length, m = b.length;
    if (Math.abs(n - m) > max) return max + 1;
    let prev2 = null, prev = new Array(m + 1), cur = new Array(m + 1);
    for (let j = 0; j <= m; j++) prev[j] = j;
    for (let i = 1; i <= n; i++) {
      cur[0] = i; let rowMin = cur[0];
      for (let j = 1; j <= m; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
        cur[j] = v; if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return max + 1;

<script>
(function(){
"use strict";
const A = window.MedAnalyzer;
const APP = JSON.parse(document.getElementById("appdata").textContent);
const E = APP.E, M = APP.M, F = APP.F;
M.forEach((m, i) => { m.id = i; });
const D = { IDX: A.build(M), WORDS: APP.WORDS, OVR: APP.OVR, PREFER_SEG: {} };
const NOTE = APP.NOTE || {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TYPE = { P: "접두사", R: "어근", S: "접미사", V: "결합모음", W: "단어" };
const FIELD = APP.fields;

// ---------- 저장(브라우저마다 따로) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("medilens:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("medilens:" + k, JSON.stringify(v)); } catch (e) {} }
};
let favs = store.get("fav", []);
let recent = store.get("recent", []);

// ---------- 색인 ----------
const keyOf = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const lowOf = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").replace(/[‐-―]/g, "-").replace(/\s+/g, " ").trim();
const VAR = new Map(), AB = new Map(), MK = new Map();
const push = (map, k, v) => { if (!k) return; let a = map.get(k); if (!a) map.set(k, a = []); if (!a.includes(v)) a.push(v); };
E.forEach((e, i) => {
  e.i = i;
  for (const v of e.v) push(VAR, keyOf(v), i);
  push(VAR, keyOf(e.e), i);
  if (e.a) for (const t of e.a.split(/,\s*/)) { push(AB, t.trim().toLowerCase(), i); push(AB, keyOf(t), i); }
  e.kos = e.m.map((m) => m[1]).join(" ").replace(/\s+/g, "");
});
const ftok = (f) => f.split(",").map((x) => x.trim()).filter(Boolean);
M.forEach((m, j) => {
  for (const t of ftok(m.f)) {
    push(MK, t.toLowerCase(), j);
    const bare = t.toLowerCase().replace(/[\/\-]/g, "");
    push(MK, bare, j);
  }
  for (const s of m.st) { push(MK, s, j); if (m.t === "R") push(MK, s + "o", j); }
});
// 철자 추천용 키
const SKEYS = [];
E.forEach((e, i) => { for (const v of e.v) { const k = keyOf(v); if (k.length >= 3) SKEYS.push({ k, l: A.loose(k), ref: "e" + i }); } });
M.forEach((m, j) => { for (const t of ftok(m.f)) { const k = keyOf(t); if (k.length >= 3) SKEYS.push({ k, l: A.loose(k), ref: "m" + j }); } });
const PFX = E.map((e, i) => ({ k: keyOf(e.v[0]), i })).sort((a, b) => a.k.localeCompare(b.k));

// ---------- 소리 ----------
let VOICE = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find((v) => /en[-_]US/i.test(v.lang) && /google/i.test(v.name)) || vs.find((v) => /en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  } catch (e) { VOICE = null; }
}
if ("speechSynthesis" in window) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function speakList(list, rate) {
  if (!("speechSynthesis" in window)) { toast("이 기기에서는 소리 듣기를 지원하지 않아요"); return; }
  try {
    speechSynthesis.cancel();
    list.forEach((t) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "en-US"; if (VOICE) u.voice = VOICE; u.rate = rate || 0.9;
      speechSynthesis.speak(u);
    });
  } catch (e) { toast("소리를 재생하지 못했어요"); }
}
const speak = (t, r) => speakList([t], r);
function spokenTerm(t) { return String(t).replace(/\([^)]*\)/g, " ").split(",")[0].replace(/[_\/]/g, " ").trim(); }

// ---------- 공통 조각 ----------
function srcBadge(m) {
  const cls = m[3] === "t" ? "tb" : "sup";
  return '<span class="src ' + cls + '">' + esc(m[0]) + "</span>";
}
function chTag(n) { const c = APP.chapters[n]; return c ? "교재 " + n + "장 " + c.short : "교재 " + n + "장"; }
function entryBadge(e) {
  if (e.ch && e.ch.length) return '<span class="src tb">교재 ' + e.ch.slice().sort((a, b) => a - b).join("·") + "장</span>";
  if (e.f && e.f.length) return '<span class="src sup">' + esc(FIELD[e.f[0]]) + "</span>";
  return "";
}
function mainKo(e) { return e.m[0][1]; }
function hcls(t) { const L = Math.max.apply(null, String(t).split(/\s+/).map((w) => w.length)); return L > 22 ? "xlong" : L > 15 ? "long" : ""; }
function rowHTML(e) {
  return '<li><button class="row" data-e="' + e.i + '"><span class="rm"><div class="re">' + esc(e.e) + '</div><div class="rk">' + esc(mainKo(e)) + (e.a ? " · " + esc(e.a) : "") + '</div></span><span class="rb">' + entryBadge(e) + "</span></button></li>";
}
function mrowHTML(m) {
  return '<li><button class="row" data-m="' + m.id + '"><span class="rm"><div class="re" style="font-family:ui-monospace,Menlo,monospace">' + esc(m.f) + '</div><div class="rk">' + esc(mKo(m)) + '</div></span><span class="rb"><span class="src ' + (m.tb ? "tb" : "sup") + '">' + TYPE[m.t] + "</span></span></button></li>";
}
function mKo(m) { return m.tb ? F[m.tb[0]].ko : m.ko; }
function pillE(e) { return '<button class="pill" data-e="' + e.i + '">' + esc(e.e.replace(/\s*\([^)]*\)/g, "")) + "<small>" + esc(mainKo(e)) + "</small></button>"; }

// 조각 하나의 결합형 정보
function partMorph(p) {
  if (p.t === "V") return null;
  if (p.id !== undefined && M[p.id]) return M[p.id];
  const cand = MK.get(p.s) || [];
  const same = cand.map((j) => M[j]).filter((m) => m.t === p.t && m.st.includes(p.s));
  if (same.length) return same[0];
  const any = cand.map((j) => M[j]).filter((m) => m.st.includes(p.s));
  return any[0] || null;
}
function partLabel(p) { return p.t === "P" ? p.s + "-" : p.t === "S" ? "-" + p.s : p.s; }

// 한 단어 분석 → HTML
function analysisHTML(term, opts) {
  opts = opts || {};
  const res = A.analyzeTerm(term, D);
  if (!res.length) return { html: "", parts: [], res };
  let html = "", allParts = [];
  res.forEach((r) => {
    const w = r.w;
    if (/^[a-z]$/i.test(w) || /^(i|ii|iii|iv)$/i.test(w) && res.length > 1) {
      html += '<div class="word"><div class="wl">' + esc(w) + ' · 기호</div></div>'; return;
    }
    html += '<div class="word"><div class="wl"><b>' + esc(w) + "</b>" + (r.plural ? " · 복수형/변화형" : "") + (r.how === "seg" && opts.auto ? ' · <span class="src auto">자동 분석</span>' : "") + "</div>";
    if (r.how === "ovr" || r.how === "seg") {
      html += '<div class="chips">';
      r.parts.forEach((p, k) => {
        if (k) html += '<span class="plus">+</span>';
        const m = partMorph(p);
        html += '<button class="chip ' + p.t + '"' + (m ? ' data-m="' + m.id + '"' : "") + '><span class="cs">' + esc(partLabel(p)) + '</span><span class="ck">' + esc(p.t === "V" ? "결합모음" : (p.ko || (m ? m.ko : ""))) + "</span>" + (p.t === "V" ? "" : '<span class="ct">' + TYPE[p.t] + "</span>") + "</button>";
        allParts.push({ p, m, w });
      });
      html += "</div>";
    } else if (r.how === "word") {
      const note = NOTE[w.toLowerCase()];
      html += '<div class="chips"><span class="chip W"><span class="cs">' + esc(w) + '</span><span class="ck">' + esc(r.gloss) + '</span><span class="ct">단어</span></span></div>';
      if (note) html += '<div class="hint" style="margin-top:6px">이렇게도 써요: ' + esc(note) + "</div>";
    } else {
      html += '<div class="hint">작은 조각으로 나누지 않는 단어예요(고유명사·약 이름 등).</div>';
    }
    html += "</div>";
  });
  return { html, parts: allParts, res };
}
function readingOrder(res) {
  // 접미사(맨 뒤) → 접두사 → 어근 순서로 뜻을 풀어요
  const lines = [];
  res.forEach((r) => {
    if (!(r.how === "ovr" || r.how === "seg")) return;
    const ps = r.parts.filter((p) => p.t !== "V");
    if (ps.length < 2) return;
    const last = ps[ps.length - 1];
    const seq = [];
    if (last.t === "S") seq.push(last);
    ps.forEach((p) => { if (p !== last || last.t !== "S") if (p.t === "P") seq.push(p); });
    ps.forEach((p) => { if (p.t === "R") seq.push(p); });
    ps.forEach((p) => { if (p.t === "S" && p !== last) seq.push(p); });
    if (last.t !== "S" && !seq.includes(last)) seq.push(last);
    const s = seq.map((p, i) => '<span class="n">' + (i + 1) + "</span><b>" + esc(partLabel(p)) + "</b>(" + esc(p.ko || "") + ")").join(" → ");
    lines.push((res.length > 1 ? "<b>" + esc(r.w) + "</b>: " : "") + s);
  });

function koSearch(q) {

  });

}

  const nTB = E.filter((e) => e.ch).length, nSup = E.filter((e) => !e.ch).length;
  let h = '<div class="card"><h3>이렇게 써 보세요</h3><div class="hint">영어 의학용어를 넣으면 <b>한글 발음·뜻·단어 구조(접두사/어근/접미사)</b>를 보여 줘요. 한글 뜻, 약어, 결합형으로도 찾을 수 있고, 철자가 틀리면 비슷한 단어를 추천해 줘요.</div>';
  h += '<div class="ex">' + [["cardiomyopathy", "용어"], ["심근경색", "한글 뜻"], ["MRSA", "약어"], ["-itis", "결합형"], ["cardiomiopathy", "철자 틀림"], ["hepatosplenomegaly", "자동 분석"]].map((x) => '<button data-q="' + esc(x[0]) + '">' + esc(x[0]) + ' <span style="font-weight:500;opacity:.7">' + esc(x[1]) + "</span></button>").join("") + "</div></div>";
  if (recent.length) {
    h += '<div class="card"><h3>최근에 본 것</h3><div class="pills">' + recent.map((r, k) => '<button class="pill" data-rec="' + k + '">' + esc(r.l) + "</button>").join("") + '</div><button class="more" id="clrRec">기록 지우기</button></div>';
  }
  h += '<div class="card"><h3>교재 단원별</h3><div class="grid">';
  Object.keys(APP.chapters).map(Number).sort((a, b) => a - b).forEach((n) => {
    const c = APP.chapters[n]; const cnt = E.filter((e) => e.ch && e.ch.includes(n)).length;
    h += '<button class="tile" data-list="ch:' + n + '"><b>' + n + "장 " + esc(c.short) + "</b><span>용어 " + cnt + "개</span></button>";
  });
  h += '</div><h3>과목별 보충 용어</h3><div class="grid">';
  Object.keys(FIELD).forEach((f) => { const cnt = E.filter((e) => e.f && e.f.includes(f)).length; h += '<button class="tile" data-list="f:' + f + '"><b>' + esc(FIELD[f]) + "</b><span>" + cnt + "개</span></button>"; });
  h += '</div><h3>결합형 사전</h3><div class="grid">';
  [["P", "접두사"], ["R", "어근(결합형)"], ["S", "접미사"]].forEach(([t, l]) => { h += '<button class="tile" data-list="mt:' + t + '"><b>' + l + "</b><span>" + M.filter((m) => m.t === t).length + "개</span></button>"; });
  h += "</div></div>";
  h += '<div class="card"><h3>데이터 정보</h3><div class="hint">교재 『문제 중심 의학용어』 용어 ' + nTB + "개 + 과목별 보충 용어 " + nSup + "개 + 결합형 " + M.length + "개 (" + esc(APP.built) + ' 기준)<br><span class="src tb">교재</span> 표시는 교재에 나온 뜻, <span class="src sup">보충</span> 표시는 교재 밖에서 덧붙인 뜻·설명이에요. 시험은 교재 뜻을 기준으로 외우세요.<br>더 넣고 싶은 용어(해부학·생리학·미생물학·약리학·병리학 등)가 있으면 Claude에게 말해 주세요.</div></div>';
  main.innerHTML = h;
  const cr = $("#clrRec"); if (cr) cr.onclick = () => { recent = []; store.set("recent", recent); renderHome(); };
}

// ---------- 자동완성 ----------
const sugg = $("#sugg");
const qi = $("#q"), clr = $("#clr");
let tmr = null;
let sIdx = -1, sItems = [];
function hideSugg() { clearTimeout(tmr); sugg.classList.remove("on"); sIdx = -1; }
function showSugg(q) {
  q = q.trim();
  if (document.activeElement !== qi) { hideSugg(); return; }
  if (q.length < 1) { hideSugg(); return; }
  const items = [];
  if (isKo(q)) {
    if (q.replace(/\s/g, "").length >= 1) koSearch(q).es.slice(0, 8).forEach((e) => items.push({ e }));
  } else {
    const ab = (AB.get(q.toLowerCase()) || []).slice(0, 3);
    ab.forEach((i) => items.push({ e: E[i], hint: "약어" }));
    findMorph(q).slice(0, 2).forEach((j) => items.push({ m: M[j] }));
    prefixMatches(q, 8).forEach((e) => { if (!items.some((x) => x.e === e)) items.push({ e }); });
    if (items.length < 3 && keyOf(q).length >= 4) suggest(q, 4).forEach((s) => { if (s.e && !items.some((x) => x.e === s.e)) items.push({ e: s.e, hint: "비슷한 철자" }); if (s.m && !items.some((x) => x.m === s.m)) items.push({ m: s.m, hint: "비슷한 철자" }); });
  }
  sItems = items.slice(0, 9);
  if (!sItems.length) { hideSugg(); return; }
  sugg.innerHTML = sItems.map((x, k) => x.e
    ? '<button data-si="' + k + '"><span class="se">' + esc(x.e.e) + '</span><span class="sk">' + esc(mainKo(x.e)) + '</span><span class="sh">' + esc(x.hint || (x.e.ch ? "교재 " + x.e.ch[0] + "장" : "보충")) + "</span></button>"
    : '<button data-si="' + k + '"><span class="se" style="font-family:ui-monospace,Menlo,monospace">' + esc(x.m.f) + '</span><span class="sk">' + esc(mKo(x.m)) + '</span><span class="sh">' + esc(x.hint || TYPE[x.m.t]) + "</span></button>").join("");
  sugg.classList.add("on"); sIdx = -1;
}
function pickSugg(k) {
  const x = sItems[k]; if (!x) return;
  hideSugg(); $("#q").blur();
  if (x.e) go({ t: "e", i: x.e.i }); else go({ t: "m", j: x.m.id });
}

// ---------- 이벤트 ----------
qi.addEventListener("input", () => { clr.hidden = !qi.value; clearTimeout(tmr); tmr = setTimeout(() => showSugg(qi.value), 90); });
qi.addEventListener("focus", () => { if (qi.value) showSugg(qi.value); });
qi.addEventListener("keydown", (ev) => {
  if (!sugg.classList.contains("on")) return;
  const bs = sugg.querySelectorAll("button");
  if (ev.key === "ArrowDown") { sIdx = Math.min(bs.length - 1, sIdx + 1); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { sIdx = Math.max(-1, sIdx - 1); ev.preventDefault(); }
  else if (ev.key === "Escape") { hideSugg(); return; }
  else return;
  bs.forEach((b, k) => b.classList.toggle("sel", k === sIdx));
});
$("#form").addEventListener("submit", (ev) => { ev.preventDefault(); if (sIdx >= 0) return pickSugg(sIdx); hideSugg(); submit(qi.value); });
clr.addEventListener("click", () => { qi.value = ""; clr.hidden = true; hideSugg(); qi.focus(); });
sugg.addEventListener("mousedown", (ev) => ev.preventDefault());
sugg.addEventListener("click", (ev) => { const b = ev.target.closest("[data-si]"); if (b) pickSugg(+b.dataset.si); });
document.addEventListener("click", (ev) => { if (!ev.target.closest(".searchbox")) hideSugg(); });
$("#btnHome").onclick = () => { qi.value = ""; clr.hidden = true; go({ t: "home" }); };
$("#btnFav").onclick = () => go({ t: "fav" });
main.addEventListener("click", (ev) => {
  const t = ev.target.closest("button,[data-m],[data-e]");
  if (!t) return;
  if (t.id === "back") return back();
  if (t.dataset.say !== undefined) return speak(t.dataset.say, 0.9);
  if (t.dataset.slow !== undefined) return speak(t.dataset.slow, 0.55);
  if (t.dataset.pieces) { try { return speakList(JSON.parse(t.dataset.pieces), 0.75); } catch (e) { return; } }
  if (t.dataset.fav) {
    const k = t.dataset.fav;
    favs = favs.includes(k) ? favs.filter((x) => x !== k) : [k].concat(favs);
    store.set("fav", favs);
    const on = favs.includes(k); t.classList.toggle("on", on); t.textContent = on ? "★" : "☆";
    toast(on ? "즐겨찾기에 넣었어요" : "즐겨찾기에서 뺐어요"); return;
  }
  if (t.dataset.e !== undefined) return go({ t: "e", i: +t.dataset.e });
  if (t.dataset.m !== undefined) return go({ t: "m", j: +t.dataset.m });
  if (t.dataset.list) return go({ t: "list", k: t.dataset.list });
  if (t.dataset.q) { qi.value = t.dataset.q; clr.hidden = false; return submit(t.dataset.q); }
  if (t.dataset.rec !== undefined) { const r = recent[+t.dataset.rec]; if (r) return go(r.v); }
});
let tt = null;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1600); }
$("#foot").innerHTML = "메디렌즈 · 교재 『문제 중심 의학용어』 기반 · 보충 자료는 교재와 구분해 표시해요";
try{if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
// 테스트용
window.__ML = { submit, go, E, M, back };
go({ t: "home" }, false);
stack = [{ t: "home" }];
})();
</script>
